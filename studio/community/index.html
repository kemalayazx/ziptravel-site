<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightfall — Community lines</title>
<style>
  :root{--bg:#0d1117;--fg:#e6edf3;--muted:#8b949e;--card:#161b22;--line:#21262d;
        --accent:#fe2c55;--ok:#2ea043}
  @media (prefers-color-scheme:light){:root{--bg:#fff;--fg:#1f2328;--muted:#59636e;
        --card:#f6f8fa;--line:#d1d9e0}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--fg);line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:19px;margin:0 0 4px}
  .lead{color:var(--muted);font-size:13px;margin:0 0 22px}
  .c{background:var(--card);border:1px solid var(--line);border-radius:12px;
     padding:14px;margin-bottom:14px}
  .h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
  .lang{background:var(--line);border-radius:4px;padding:1px 6px;text-transform:uppercase;
        font-weight:600;color:var(--fg)}
  .today{color:var(--accent);font-weight:600}
  pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:15px;
      margin:0 0 12px;padding:10px;background:var(--bg);border:1px solid var(--line);
      border-radius:8px}
  button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 16px;
         background:var(--accent);color:#fff;width:100%;cursor:pointer}
  button.done{background:var(--ok)}
  .empty{color:var(--muted);text-align:center;padding:50px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Community lines</h1>
  <p class="lead">YouTube has no API for community posts, so these are written and
     translated for you — posting is the paste. A week at a time, so one sitting covers it.
     Today's line is in the language of today's video.</p>
  <div id="list" class="empty">Loading…</div>
</div>
<script>
const $ = id => document.getElementById(id);

async function load() {
  let api;
  try {
    api = (await (await fetch("../api.json?t=" + Date.now(), { cache: "no-store" })).json()).api;
  } catch { $("list").textContent = "Backend offline."; return; }

  let items;
  try {
    items = (await (await fetch(api + "/community", { cache: "no-store" })).json()).lines;
  } catch { $("list").textContent = "Could not load lines."; return; }

  const esc = s => s.replace(/[<>&]/g, m => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[m]));
  $("list").className = "";
  $("list").innerHTML = items.map((c, i) => `
    <div class="c">
      <div class="h">
        <span class="lang">${c.lang}</span>
        <span class="${i === 0 ? "today" : ""}">${i === 0 ? "today" : c.date.slice(5)}</span>
      </div>
      <pre id="t${i}">${esc(c.text)}</pre>
      <button data-i="${i}">Copy</button>
    </div>`).join("");

  $("list").querySelectorAll("button").forEach(b => b.onclick = async () => {
    const text = $("t" + b.dataset.i).textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    b.textContent = "Copied ✓"; b.classList.add("done");
    setTimeout(() => { b.textContent = "Copy"; b.classList.remove("done"); }, 2000);
  });
}
load();
</script>
</body>
</html>
